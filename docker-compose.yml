services:
  # =========================================================================
  # 1. EDGE PROXY TIER (PROD)
  # =========================================================================

  # =========================================================================
  # 2. DATA STORAGE TIER (PROD & DEV)
  # =========================================================================
  redis:
    image: redis:alpine
    profiles: ["dev", "prod"]
    container_name: redis-v1
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - traefik_public

  neo4j:
    image: neo4j:5-community
    profiles: ["dev", "prod"]
    container_name: neo4j-v1
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/sousToolsPassword
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
    networks:
      - traefik_public

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["dev"]
    container_name: qdrant-v1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - traefik_public
    labels:
      - "traefik.enable=false"
    deploy:
      resources:
        limits:
          memory: 2g

  qdrant-sync:
    image: python:3.11-slim
    profiles: ["dev"]
    container_name: qdrant-sync-v1
    depends_on:
      - qdrant
    volumes:
      - ./scripts:/app/scripts
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        pip install --no-cache-dir qdrant-client
        echo "Waiting for Qdrant database service to initialize..."
        sleep 5
        python3 /app/scripts/populate_qdrant.py
        echo "Qdrant initial synchronization complete!"
    networks:
      - traefik_public

  # =========================================================================
  # 3. LLM GATEWAY TIER (PROD & DEV — runs on Home Desktop with AMD GPU)
  #    Other devices connect to ai.sous.tools externally via Tailscale/DNS
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    profiles: ["dev"]
    container_name: ollama-v1
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 8g

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["dev"]
    container_name: ollama-pull-v1
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for Ollama service to respond..."
        sleep 10
        MODELS="qwen2.5-coder:14b nomic-embed-text llama3.2-vision"
        for model in $$MODELS; do
          echo "Verifying/Pulling model $$model..."
          ollama pull $$model
        done
        echo "Cleaning up old models..."
        ollama rm qwen2.5-coder:7b || true
        echo "Ollama model synchronization complete!"
    networks:
      - traefik_public

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["dev"]
    container_name: litellm-v1
    restart: unless-stopped
    command: [
        "--config",
        "/workspace/litellm_config.yaml",
        "--port",
        "4000",
        # "--detailed_debug"
      ]
    volumes:
      - ./:/workspace:ro
    environment:
      # - LITELLM_LOG=DEBUG
      - LITELLM_LOG=INFO
      - LITELLM_MASTER_KEY=sk-1234
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
    networks:
      - traefik_public
    depends_on:
      - ollama
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm-v1-secure.rule=Host(`ai-v1.sous.tools`)"
      - "traefik.http.routers.litellm-v1-secure.entrypoints=websecure"
      - "traefik.http.routers.litellm-v1-secure.tls=true"
      - "traefik.http.routers.litellm-v1-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.litellm-v1-service.loadbalancer.server.port=4000"
    deploy:
      resources:
        limits:
          memory: 2g

  # =========================================================================
  # 4. ORCHESTRATION & APP TIER (PROD)
  # =========================================================================
  n8n:
    image: n8nio/n8n:latest
    profiles: ["prod"]
    container_name: n8n-v1
    user: "root"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - N8N_USER_FOLDER=/home/node/.n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://n8n.sous.tools
      - N8N_WEBHOOK_URL=https://n8n.sous.tools
      - WEBHOOK_URL=https://n8n.sous.tools
      - N8N_COMMAND_ENABLE=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_TRUST_PROXY=true
      - N8N_PROXY_HOPS=1
      - NODES_EXCLUDE=[]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BLOCK_SVC_EXECUTION_FROM_COMMAND=false
      - N8N_SECURE_COOKIE=false
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    volumes:
      - n8n_data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-v1-secure.rule=Host(`n8n-v1.sous.tools`)"
      - "traefik.http.routers.n8n-v1-secure.entrypoints=websecure"
      - "traefik.http.routers.n8n-v1-secure.tls=true"
      - "traefik.http.routers.n8n-v1-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n-v1-service.loadbalancer.server.port=5678"
    deploy:
      resources:
        limits:
          memory: 2g

  agent-runner:
    build:
      context: .
      dockerfile: Dockerfile.agent-runner
    profiles: ["dev"]
    container_name: agent-runner-v1
    restart: unless-stopped
    environment:
      - OPENAI_API_BASE=https://ai.sous.tools/v1
      - OPENAI_API_KEY=sk-1234
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GIT_AUTHOR_NAME=n8n Bot
      - GIT_AUTHOR_EMAIL=n8n-bot@sous.tools
      - GIT_COMMITTER_NAME=n8n Bot
      - GIT_COMMITTER_EMAIL=n8n-bot@sous.tools
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=*
    entrypoint:
      - "/usr/bin/tini"
      - "--"
      - "/bin/sh"
      - "-c"
      - |
        export INFISICAL_TOKEN=$$(infisical login --method=universal-auth --client-id=$${INFISICAL_CLIENT_ID} --client-secret=$${INFISICAL_CLIENT_SECRET} --silent --plain)
        exec infisical run --log-level info --projectId $${INFISICAL_PROJECT_ID} --env $${INFISICAL_ENV:-dev} -- sh -c 'sleep infinity'
    volumes:
      - /home/conar/code/sous.tools:/home/conar/code/sous.tools
      - /home/conar/welshlabs/automated-kanban-agent:/kanban-agent
      - ${HOME}/.gemini:/home/cptruser/.gemini
      - ${HOME}/.config:/home/cptruser/.config
      - ${HOME}/.ssh:/home/cptruser/.ssh
      - ${HOME}/.gitconfig:/home/cptruser/.gitconfig
      # Shared pnpm store
      - ${HOME}/.local/share/pnpm:/home/cptruser/.local/share/pnpm
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 4g


  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["prod"]
    container_name: api-v1
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-v1-secure.rule=Host(`api-v1.sous.tools`)"
      - "traefik.http.routers.api-v1-secure.entrypoints=websecure"
      - "traefik.http.routers.api-v1-secure.tls=true"
      - "traefik.http.routers.api-v1-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-v1-service.loadbalancer.server.port=3001"
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 1g

  # =========================================================================
  # 5. DEV AGENT & IDE TIER (DEV)
  # =========================================================================


  # =========================================================================
  # 6. LOCAL AI MEDIA TIER (DEV)
  # =========================================================================
  whisper-stt:
    image: fedirz/faster-whisper-server:latest-cpu
    profiles: ["dev"]
    container_name: whisper-stt-v1
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=base.en # Fast, highly accurate for English
    networks:
      - traefik_public

  openedai-tts:
    image: ghcr.io/matatonic/openedai-speech:latest
    profiles: ["dev"]
    container_name: openedai-tts-v1
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    volumes:
      - tts_voices:/app/voices
    networks:
      - traefik_public

  comfyui:
    image: yanwk/comfyui-boot:rocm
    profiles: ["dev"]
    container_name: comfyui-v1
    restart: unless-stopped
    volumes:
      - sd_data:/app/ComfyUI/models
    networks:
      - traefik_public
    # devices:
    #   - "/dev/kfd:/dev/kfd"
    #   - "/dev/dri:/dev/dri"
    group_add:
      - video
    ipc: host

volumes:
  letsencrypt:
  redis_data:
  redis_dev_data:
  neo4j_data:
  neo4j_dev_data:
  qdrant_data:
  ollama_data:
  n8n_data:
  cptr_data:
  cptr_projects:
  cptr_home_data:
  cptr_gemini_data:
  tts_voices:
  sd_data:

networks:
  traefik_public:
    name: traefik_public
    external: true
